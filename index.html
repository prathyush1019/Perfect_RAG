<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Voice AI Chunking Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #0d1117;
            color: #e6edf3;
            line-height: 1.5;
            padding: 32px 16px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
        }
        header {
            margin-bottom: 28px;
            border-bottom: 1px solid #30363d;
            padding-bottom: 16px;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #58a6ff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        p.subtitle {
            color: #8b949e;
            font-size: 14px;
            margin-top: 4px;
        }
        .card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 24px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #c9d1d9;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }
        textarea {
            width: 100%;
            height: 200px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            padding: 12px;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        textarea:focus {
            border-color: #58a6ff;
        }
        .file-input-wrapper {
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        input[type="file"] {
            font-size: 13px;
            color: #8b949e;
        }
        .grid-3 {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-top: 16px;
        }
        input[type="number"], select {
            width: 100%;
            background-color: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #e6edf3;
            font-size: 14px;
            padding: 10px 12px;
            outline: none;
        }
        input[type="number"]:focus, select:focus {
            border-color: #58a6ff;
        }
        .btn-chunk {
            width: 100%;
            background-color: #238636;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            padding: 12px 16px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            margin-top: 20px;
            transition: background-color 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .btn-chunk:hover {
            background-color: #2ea043;
        }
        .btn-chunk:disabled {
            background-color: #21262d;
            color: #8b949e;
            cursor: not-allowed;
        }
        .status-bar {
            margin: 16px 0;
            font-size: 14px;
            font-weight: 500;
            color: #58a6ff;
            display: none;
        }
        .chunks-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .btn-export {
            background-color: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
        }
        .btn-export:hover {
            background-color: #30363d;
        }
        .chunk-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 16px;
            margin-bottom: 16px;
        }
        .chunk-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border-bottom: 1px solid #21262d;
            padding-bottom: 8px;
        }
        .chunk-badge {
            font-size: 12px;
            font-weight: 600;
            background: #1f242c;
            border: 1px solid #388bfd33;
            color: #58a6ff;
            padding: 2px 8px;
            border-radius: 4px;
        }
        .chunk-meta {
            font-size: 12px;
            color: #8b949e;
        }
        .subheading {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 10px;
            margin-bottom: 4px;
        }
        .text-searchable {
            color: #d29922;
        }
        .text-spoken {
            color: #3fb950;
        }
        pre.content-box {
            background-color: #0d1117;
            border: 1px solid #21262d;
            border-radius: 6px;
            padding: 10px 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12.5px;
            color: #c9d1d9;
            white-space: pre-wrap;
            word-break: break-word;
            margin-bottom: 6px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎙️ Voice AI Chunking Engine</h1>
            <p class="subtitle">Enter your document, chunk size, overlap, and model to generate voice-first discrete chunks.</p>
        </header>

        <div class="card">
            <label>1. Document</label>
            <div class="file-input-wrapper">
                <input type="file" id="fileInput" accept=".txt,.md,.pdf,.docx">
                <span id="fileNameDisplay" style="font-size: 12px; color: #8b949e;"></span>
            </div>
            <textarea id="documentText" placeholder="Paste your document content here..."></textarea>

            <div style="display: grid; grid-template-columns: 1.2fr 1fr 1fr 1fr; gap: 12px; margin-top: 16px;">
                <div>
                    <label for="unitSelect">Unit & Model Target</label>
                    <select id="unitSelect" onchange="handleUnitChange()">
                        <option value="tokens" selected>Tokens (Cloudflare 512)</option>
                        <option value="characters">Characters</option>
                    </select>
                </div>
                <div>
                    <label for="chunkSize" id="chunkSizeLabel">Max Ceiling (Tokens)</label>
                    <input type="number" id="chunkSize" value="512" min="20" max="8192">
                </div>
                <div>
                    <label for="overlapWords" id="overlapLabel">Overlap (Tokens)</label>
                    <input type="number" id="overlapWords" value="50" min="0" max="1000">
                </div>
                <div>
                    <label for="modelSelect">LLM Normalizer</label>
                    <select id="modelSelect">
                        <option value="none" selected>None (Deterministic Fast)</option>
                        <option value="gemini-3.8-flash">Gemini 3.8 Flash (Active)</option>
                        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
                        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
                    </select>
                </div>
            </div>

            <button class="btn-chunk" id="btnChunk" onclick="handleChunk()">
                ⚡ Chunk Document
            </button>
            <div class="status-bar" id="statusBar">Processing document...</div>
        </div>

        <div id="outputSection" style="display: none;">
            <div class="chunks-header">
                <h2 style="font-size: 18px; font-weight: 600;" id="chunksCountTitle">Generated Chunks</h2>
                <button class="btn-export" onclick="exportJSON()">📥 Download JSON</button>
            </div>
            <div id="chunksFeed"></div>
        </div>
    </div>

    <script>
        let currentChunks = [];

        // Pre-fill sample document
        document.getElementById('documentText').value = `# Apex Dental Care - Comprehensive Pricing Schedule 2026

All prices are quoted in Indian Rupees (₹ INR) and include all clinical consultations.

| Treatment | Base Price | Warranty | Pre-requisite |
|---|---|---|---|
| Scaling & Ultrasonic Root Polishing | ₹1,500 | 6 Months Routine Checkup | None |
| Laser Teeth Whitening (Dual-Arch) | ₹8,500 | 1 Year Color Retention | Dental Cleaning |
| Single Sitting Rotary Root Canal | ₹4,500 | 5 Years Structural Guarantee | Diagnostic X-Ray |
| Zirconia Monolithic Crown | ₹6,000 | 15 Years Replacement Warranty | Root Canal / Prep |
| Nobel Biocare Titanium Implant | ₹28,000 | Lifetime Manufacturer Warranty | CBCT 3D Scan |`;

        // Handle file selection
        document.getElementById('fileInput').addEventListener('change', async function(e) {
            const file = e.target.files[0];
            if (!file) return;

            document.getElementById('fileNameDisplay').innerText = file.name;
            const formData = new FormData();
            formData.append('file', file);

            try {
                const res = await fetch('/api/parse_file', {
                    method: 'POST',
                    body: formData
                });
                const data = await res.json();
                if (data.text) {
                    document.getElementById('documentText').value = data.text;
                } else if (data.error) {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                // If text file, fallback to FileReader
                const reader = new FileReader();
                reader.onload = function(evt) {
                    document.getElementById('documentText').value = evt.target.result;
                };
                reader.readAsText(file);
            }
        });

        function handleUnitChange() {
            const unit = document.getElementById('unitSelect').value;
            const sizeInput = document.getElementById('chunkSize');
            const overlapInput = document.getElementById('overlapWords');
            const sizeLabel = document.getElementById('chunkSizeLabel');
            const overlapLabel = document.getElementById('overlapLabel');

            if (unit === 'characters') {
                sizeLabel.innerText = 'Max Ceiling (Chars)';
                overlapLabel.innerText = 'Overlap (Chars)';
                sizeInput.value = 2000;
                overlapInput.value = 200;
                sizeInput.max = 8000;
            } else {
                sizeLabel.innerText = 'Max Ceiling (Tokens)';
                overlapLabel.innerText = 'Overlap (Tokens)';
                sizeInput.value = 512;
                overlapInput.value = 50;
                sizeInput.max = 4096;
            }
        }

        async function handleChunk() {
            const text = document.getElementById('documentText').value.trim();
            if (!text) {
                alert('Please enter or upload a document.');
                return;
            }

            const unit = document.getElementById('unitSelect').value;
            const chunkSize = parseInt(document.getElementById('chunkSize').value) || (unit === 'characters' ? 2000 : 512);
            const overlap = parseInt(document.getElementById('overlapWords').value) || (unit === 'characters' ? 200 : 50);
            const model = document.getElementById('modelSelect').value;

            const btn = document.getElementById('btnChunk');
            const status = document.getElementById('statusBar');

            btn.disabled = true;
            status.style.display = 'block';
            status.innerText = 'Processing document chunks with hard ceiling...';

            try {
                const res = await fetch('/api/chunk', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        text: text,
                        unit: unit,
                        chunk_size: chunkSize,
                        overlap: overlap,
                        model: model
                    })
                });

                const data = await res.json();
                if (data.error) {
                    alert('Error: ' + data.error);
                    return;
                }

                currentChunks = data.chunks || [];
                renderChunks(currentChunks, data.stats, chunkSize, unit);
            } catch (err) {
                alert('Error connecting to backend: ' + err.message);
            } finally {
                btn.disabled = false;
                status.style.display = 'none';
            }
        }

        function renderChunks(chunks, stats, ceiling, unit) {
            const outSec = document.getElementById('outputSection');
            const feed = document.getElementById('chunksFeed');
            const title = document.getElementById('chunksCountTitle');

            outSec.style.display = 'block';
            title.innerText = `Generated Chunks (${chunks.length} Total • Strict Ceiling: ${ceiling} ${unit})`;
            feed.innerHTML = '';

            chunks.forEach(c => {
                const card = document.createElement('div');
                card.className = 'chunk-card';

                const charCount = c.char_count || (c.text ? c.text.length : 0);
                const tokenCount = c.token_count || Math.max(1, Math.round(charCount / 4));
                const chunkText = c.text || c.searchable_augmented_text || c.raw_text || '';
                const metadataObj = c.metadata || {};

                card.innerHTML = `
                    <div class="chunk-card-header">
                        <div>
                            <span class="chunk-badge">Chunk #${c.chunk_id}</span>
                            <span style="font-weight:600; font-size:13px; margin-left:6px; color:#e6edf3;">${(c.chunk_type || 'TEXT').toUpperCase()}</span>
                        </div>
                        <div class="chunk-meta">
                            <strong>${charCount}</strong> chars • ~<strong>${tokenCount}</strong> tokens
                            <button onclick="navigator.clipboard.writeText(decodeURIComponent('${encodeURIComponent(chunkText)}')); this.innerText='Copied!'; setTimeout(() => this.innerText='Copy Text', 1500);" style="margin-left: 10px; background: #21262d; border: 1px solid #30363d; color: #58a6ff; border-radius: 4px; padding: 2px 8px; font-size: 11px; cursor: pointer; font-weight:600;">Copy Text</button>
                        </div>
                    </div>
                    <div class="subheading" style="color: #3fb950;">⚡ Text Payload (Send to Cloudflare Embedding API):</div>
                    <pre class="content-box">${escapeHtml(chunkText)}</pre>
                    <details style="margin-top: 8px; font-size: 12px; color: #8b949e;">
                        <summary style="cursor: pointer; color: #d29922; font-weight: 500;">📁 Vector DB Payload Metadata (Store in Qdrant/Vectorize - NOT Embedded)</summary>
                        <pre style="background: #0d1117; border: 1px solid #21262d; padding: 8px 10px; border-radius: 4px; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #8b949e; white-space: pre-wrap;">${escapeHtml(JSON.stringify(metadataObj, null, 2))}</pre>
                    </details>
                `;
                feed.appendChild(card);
            });

            // Smooth scroll to results
            outSec.scrollIntoView({ behavior: 'smooth' });
        }

        function escapeHtml(str) {
            if (!str) return '';
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        function exportJSON() {
            if (!currentChunks.length) return;
            const blob = new Blob([JSON.stringify(currentChunks, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'voice_ai_chunks.json';
            a.click();
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
